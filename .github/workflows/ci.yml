name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported Python on Linux, plus both ends of the range on macOS
      # and Windows. The full 3 x 5 cross product would be 15 jobs for very
      # little more information: what differs across operating systems here is
      # libm (an ULP in np.tan or gamma) and path handling, and neither depends
      # on the Python minor version.
      #
      # Windows is not decorative. `user_cache_dir()` has a LOCALAPPDATA branch
      # that nothing has ever executed, and the table cache is all path
      # handling. Both arrive later in this series, so the matrix goes in first
      # and every commit after it is tested on all three systems -- rather than
      # the coverage arriving at the end, after the code it exists to check.
      matrix:
        include:
          - {os: ubuntu-latest,  python-version: "3.9",  label: "py3.9"}
          - {os: ubuntu-latest,  python-version: "3.10", label: "py3.10"}
          - {os: ubuntu-latest,  python-version: "3.11", label: "py3.11"}
          - {os: ubuntu-latest,  python-version: "3.12", label: "py3.12"}
          - {os: ubuntu-latest,  python-version: "3.13", label: "py3.13"}
          - {os: macos-latest,   python-version: "3.10", label: "macos py3.10"}
          - {os: macos-latest,   python-version: "3.13", label: "macos py3.13"}
          - {os: windows-latest, python-version: "3.10", label: "windows py3.10"}
          - {os: windows-latest, python-version: "3.13", label: "windows py3.13"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show environment
        run: python -c "import numpy, scipy; print('numpy', numpy.__version__, '| scipy', scipy.__version__)"

      - name: Run tests
        run: python -m pytest tests/ -q

  test-numpy1:
    name: numpy 1.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The package is still widely used with the NumPy 1.x series, and one
      # known bug (np.Inf, removed in NumPy 2.0) behaves differently there, so
      # this leg keeps both paths honest. Constraints go first, then the package
      # with --no-deps, so pip cannot quietly upgrade numpy back to 2.x.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "scipy<1.12" pytest
          python -m pip install -e . --no-deps

      - name: Show environment
        run: python -c "import numpy, scipy; print('numpy', numpy.__version__, '| scipy', scipy.__version__)"

      - name: Run tests
        run: python -m pytest tests/ -q

  test-numpy2:
    name: numpy 2.x (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The matrix legs above take whatever numpy resolves to today, which is a
      # moving target. This one pins the 2.x series explicitly, so the pair of
      # legs states the supported range as a fact rather than as a coincidence
      # of when CI last ran.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "scipy>=1.13" pytest
          python -m pip install -e . --no-deps

      - name: Show environment
        run: python -c "import numpy, scipy; print('numpy', numpy.__version__, '| scipy', scipy.__version__)"

      - name: Run tests
        run: python -m pytest tests/ -q

  golden:
    name: golden file is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.5.2" "scipy==1.18.1"
          python -m pip install -e . --no-deps

      # Regenerates all 251 cases from scratch and compares them against the
      # committed file, so a reviewer can trust golden_v1.jsonl without reading
      # 250 lines of hex floats.
      #
      # Deliberately not --strict-bytes: byte-identical regeneration holds only
      # on a fixed platform, since np.tan / gamma differ by an ULP across libm
      # builds. The flag exists for local use; gating CI on it would just make
      # the suite fail on whichever OS the goldens were not generated on.
      - name: Verify golden file
        run: python tests/golden/generate.py --check

  legacy-doctests:
    name: legacy doctests (known failing)
    runs-on: ubuntu-latest
    # Informational, not a gate. These are the package's only pre-existing
    # tests and 4 of them fail on current NumPy/SciPy for two independent
    # reasons: last-digit drift in the L-BFGS-B optimum, and NumPy 2 rendering
    # scalars as np.float64(...). Replacing them is the point of this PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run doctests
        run: python -m doctest levy/__init__.py -v | tail -n 1
