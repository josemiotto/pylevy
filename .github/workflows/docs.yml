name: Docs

# Builds the documentation on every pull request, and publishes it to GitHub
# Pages from the default branch.
#
# Why Pages rather than only Read the Docs: this workflow needs no third-party
# account and no maintainer credential, and it builds on every PR, so a broken
# docs build is caught by the person who broke it. RTD PR previews need
# configuration that cannot be done from a fork. .readthedocs.yaml is committed
# too, so the existing readthedocs.io URL keeps working either way.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      # -W turns every Sphinx warning into an error: a broken cross-reference,
      # a docstring whose section markup does not parse, a page missing from
      # the toctree. Without it those accumulate silently, which is how the
      # numpy intersphinx mapping came to be pointing at a dead URL.
      - name: Build
        run: python -m sphinx -b html -W --keep-going docs/source docs/_build/html

      # Confirms the narrative pages' examples still run. The module docstrings
      # are covered by the doctests job in ci.yml.
      - name: Doctest the documentation
        run: python -m sphinx -b doctest docs/source docs/_build/doctest

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: docs/_build/html

  linkcheck:
    name: links
    runs-on: ubuntu-latest
    # Informational: an external site being down is not this repository's
    # fault, and should not turn a pull request red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: linkcheck
        run: python -m sphinx -b linkcheck docs/source docs/_build/linkcheck

  publish:
    name: publish to Pages
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
