name: Docs

# Builds the documentation on every pull request and on master, with -W, and
# runs the doctest and linkcheck builders. It does not publish anywhere.
#
# Publishing to GitHub Pages was removed on 2026-09-11: Pages is not enabled
# on this repository, enabling it takes a repository admin (Settings -> Pages
# -> Source: GitHub Actions), and actions/deploy-pages fails until it is, so
# a publish job turned every push to master red for a reason nobody with
# write access could fix. The built site is uploaded as a workflow artifact
# instead, so a reviewer can still download and read it.
#
# To publish once Pages is enabled, add back a job after `build`:
#
#   publish:
#     needs: build
#     if: github.ref == 'refs/heads/master'
#     runs-on: ubuntu-latest
#     permissions: {pages: write, id-token: write}
#     environment: {name: github-pages, url: ${{ steps.deployment.outputs.page_url }}}
#     steps:
#       - id: deployment
#         uses: actions/deploy-pages@v4
#
# and switch the artifact step below to actions/upload-pages-artifact.
# docs/proposals/repo-governance.md lists the admin setting with the others.
# .readthedocs.yaml is committed too, so the readthedocs.io URL keeps working.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      # -W turns every Sphinx warning into an error: a docstring whose section
      # markup does not parse, a page missing from the toctree, an intersphinx
      # inventory that cannot be fetched. Without it those accumulate silently,
      # which is how the numpy intersphinx mapping came to be pointing at a
      # dead URL. It does not catch an unresolved cross-reference -- that
      # needs nitpicky mode, which conf.py leaves off, and says why.
      - name: Build
        run: python -m sphinx -b html -W --keep-going docs/source docs/_build/html

      # Executes the examples marked for it: the front page's "At a glance"
      # block and the migration page's sign-flip snippet are `testcode`
      # blocks, so a rename or a changed default breaks this build. The other
      # snippets on the migration page are 1.x-versus-2.0 illustrations --
      # one of them shows a call that raises -- and are plain code blocks on
      # purpose. Module docstrings are covered by the doctests job in ci.yml.
      - name: Doctest the documentation
        run: python -m sphinx -b doctest docs/source docs/_build/doctest

      # A plain artifact, not a Pages artifact: there is no Pages site to
      # deploy to yet (see the header). Uploaded on every run, so a reviewer
      # can download the rendered site for a pull request.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

  linkcheck:
    name: links
    runs-on: ubuntu-latest
    # Informational: an external site being down is not this repository's
    # fault, and should not turn a pull request red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: linkcheck
        run: python -m sphinx -b linkcheck docs/source docs/_build/linkcheck
